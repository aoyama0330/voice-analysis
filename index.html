<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>歌声感情解析 – 分析一覧</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing:border-box; margin:0; padding:0; }
:root {
  --bg:#f2f2f4; --card:#ffffff; --card2:#ebebec;
  --border:#e0e0e0; --text:#111111; --text2:#555555; --text3:#a0a0a0;
}
body {
  font-family:'M PLUS 1',-apple-system,'Hiragino Kaku Gothic ProN',sans-serif;
  background:var(--bg); color:var(--text); min-height:100vh; padding:28px;
}
.header {
  display:flex; align-items:center; gap:14px;
  margin-bottom:36px; padding-bottom:20px; border-bottom:1px solid var(--border);
}
.header-logo {
  width:48px; height:48px; background:linear-gradient(135deg,#111111,#3f3f46);
  border-radius:12px; display:grid; place-items:center; font-size:24px; flex-shrink:0;
}
.header-text h1 { font-size:22px; font-weight:700; }
.header-text p  { font-size:15px; color:var(--text2); margin-top:2px; }

.section-title {
  font-size:13px; font-weight:700; color:var(--text3);
  text-transform:uppercase; letter-spacing:.8px; margin-bottom:16px;
}
.grid {
  display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:14px; margin-bottom:40px;
}
.entry-card {
  display:block; text-decoration:none; color:inherit;
  background:var(--card); border:1px solid var(--border); border-radius:14px;
  padding:22px; box-shadow:0 1px 4px rgba(0,0,0,.06);
  transition:box-shadow .15s, border-color .15s, transform .15s;
}
.entry-card:hover {
  box-shadow:0 4px 16px rgba(0,0,0,.1);
  border-color:#aaaaaa; transform:translateY(-2px);
}
.entry-name { font-size:17px; font-weight:700; margin-bottom:8px; }
.entry-date { font-size:13px; color:var(--text3); margin-bottom:6px; }
.entry-note { font-size:14px; color:var(--text2); margin-top:4px; }
.entry-arrow { margin-top:16px; font-size:13px; color:var(--text3); }

.empty-state { text-align:center; padding:60px 20px; color:var(--text3); grid-column:1/-1; }
.empty-state .empty-icon { font-size:48px; margin-bottom:16px; }
.empty-state p { font-size:15px; line-height:1.8; }

.how-to {
  background:var(--card); border:1px solid var(--border); border-radius:14px;
  padding:24px; box-shadow:0 1px 4px rgba(0,0,0,.06);
}
.how-to h2 { font-size:15px; font-weight:700; margin-bottom:16px; }
.steps { display:flex; flex-direction:column; gap:14px; }
.step { display:flex; gap:12px; align-items:flex-start; }
.step-num {
  width:24px; height:24px; border-radius:50%; background:var(--text); color:#fff;
  display:grid; place-items:center; font-size:12px; font-weight:700; flex-shrink:0; margin-top:2px;
}
.step-body { font-size:14px; color:var(--text2); line-height:1.8; }
.step-body code {
  background:var(--card2); padding:2px 7px; border-radius:4px;
  font-size:12px; color:var(--text); font-family:monospace; word-break:break-all;
}
.error-msg { color:#c0392b; font-size:14px; padding:20px; grid-column:1/-1; }

@media(max-width:640px) {
  body { padding:14px; }
  .grid { grid-template-columns:1fr; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-logo">🎤</div>
  <div class="header-text">
    <h1>歌声感情解析 – 分析一覧</h1>
    <p>登録された歌声の解析結果を一覧で確認できます</p>
  </div>
</div>

<div class="section-title">分析済み一覧</div>
<div class="grid" id="gallery">
  <div style="color:var(--text3);font-size:14px;padding:20px">読み込み中...</div>
</div>

<div class="how-to">
  <h2>ご利用案内</h2>
  <div class="steps">
    <div class="step">
      <div class="step-num">1</div>
      <div class="step-body">
        「音声ファイル」に歌唱データ（WAV）をドロップすると、音声とあわせて解析結果を見ることができます。
      </div>
    </div>
    <div class="step">
      <div class="step-num">2</div>
      <div class="step-body">
        歌詞には公開されているLRCファイルを取り込んでおりますが、歌詞と音声にずれがある場合、「表示タイミング補正」ボタンから0.5秒単位で補正できます。
      </div>
    </div>
  </div>
</div>

<script>
fetch('gallery.json?_=' + Date.now())
  .then(r => { if (!r.ok) throw new Error(); return r.json(); })
  .then(render)
  .catch(() => {
    document.getElementById('gallery').innerHTML =
      '<div class="error-msg">gallery.jsonを読み込めませんでした。</div>';
  });

function render(items) {
  const el = document.getElementById('gallery');
  if (!items.length) {
    el.innerHTML = `<div class="empty-state">
      <div class="empty-icon">🎵</div>
      <p>まだ登録されていません。<br>下の手順で追加してください。</p>
    </div>`;
    return;
  }
  el.innerHTML = items.map(item => `
    <a class="entry-card" href="dashboard.html?data=${encodeURIComponent(item.url)}&name=${encodeURIComponent(item.name)}${item.lyricsUrl ? '&lyrics=' + encodeURIComponent(item.lyricsUrl) : ''}">
      <div class="entry-name">${esc(item.name)}</div>
      <div class="entry-date">📅 ${esc(item.date)}</div>
      ${item.note ? `<div class="entry-note">💬 ${esc(item.note)}</div>` : ''}
      <div class="entry-arrow">分析を見る →</div>
    </a>
  `).join('');
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
